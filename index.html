<!DOCTYPE html>
<html lang="bn">
<head>

    <title>PUNARBOON - Service & Policy</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Global Reset & Centering */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Banner Theme Deep Forest Green Background */
            background: linear-gradient(135deg, #071910 0%, #0d2c1d 50%, #153c29 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center; /* স্ক্রিনের একদম মাঝখানে আনবে */
            padding: 15px;
        }

        /* Container Card */
        .container {
            width: 100%;
            max-width: 440px;
            background-color: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(212, 175, 55, 0.3); /* Gold Accent Border */
        }

        /* Header Area - Deep Forest Green & Gold Accent */
        .header {
            background: linear-gradient(180deg, #092015 0%, #0d2c1d 100%);
            color: #ffffff;
            text-align: center;
            padding: 30px 20px 25px;
            border-bottom: 3px solid #d4af37;
        }

        .brand-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .brand-title span {
            color: #d4af37; /* Gold Accent Color */
        }

        .page-subtitle {
            font-size: 14px;
            font-weight: 500;
            margin-top: 6px;
            color: #e0e0e0;
            letter-spacing: 0.5px;
        }

        /* Content Area */
        .content {
            padding: 22px 20px;
            background-color: #f8faf9;
        }

        .landing-title {
            color: #4a5568;
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* Navigation Buttons */
        .nav-btn {
            width: 100%;
            background: #ffffff;
            border: 1.5px solid #0d2c1d;
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 12px;
            font-size: 15px;
            font-weight: 700;
            color: #0d2c1d;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.25s ease;
            box-shadow: 0 3px 6px rgba(0,0,0,0.03);
        }

        .nav-btn:hover, .nav-btn:active {
            background-color: #0d2c1d;
            color: #d4af37;
            border-color: #d4af37;
            transform: translateY(-2px);
        }

        .btn-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-left i {
            font-size: 18px;
            color: #0d2c1d;
        }

        .nav-btn:hover .btn-left i {
            color: #d4af37;
        }

        /* Contact Section */
        .contact-section {
            text-align: center;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px dashed #cbd5e0;
        }

        .contact-title {
            font-size: 13px;
            color: #718096;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 13px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25);
            transition: transform 0.2s ease;
        }

        .btn-whatsapp:active {
            transform: scale(0.98);
        }

        /* Footer */
        .footer {
            background-color: #092015;
            color: #d4af37;
            text-align: center;
            padding: 15px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
